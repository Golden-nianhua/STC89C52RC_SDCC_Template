compilers:
  - description: SDCC 4.6.0 MCS-51 Small Memory Model
    match-compiler-exe: "(.*/)?sdcc(\\.exe)?"
    match-args: "-mmcs51"
    code-insight-target-name: avr
    include-dirs:
      - "${compiler-exe-dir}/../include"
      - "${compiler-exe-dir}/../include/mcs51"
    defines-text: |
      #define __SDCC_SYNTAX_FIX 1
      #define __STDC__ 1
      #define __STDC_VERSION__ 201112L
      #define __STDC_ISO_10646__ 201409L
      #define __STDC_HOSTED__ 1
      #define __STDC_UTF_16__ 1
      #define __STDC_UTF_32__ 1
      #define __STDC_NO_THREADS__ 1
      #define __STDC_NO_ATOMICS__ 1
      #define __STDC_NO_COMPLEX__ 1
      #define __STDC_NO_VLA__ 1
      #define __SDCC_mcs51 1
      #define __SDCC_MODEL_SMALL 1
      #define __SDCC_STACK_AUTO 1
      #define __SDCC_INT_LONG_REENT 1
      #define __SDCC_FLOAT_REENT 1
      #define __SDCC_CHAR_UNSIGNED 1
      #define __SDCC_VERSION_MAJOR 4
      #define __SDCC_VERSION_MINOR 6
      #define __SDCC_VERSION_PATCH 0
      #define __SDCC_REVISION 16555
      #define __SDCC 4_6_0
      #define SDCC 460
      #define __at(address)
      #define __bit bool
      #define __sbit bool
      #define __sfr unsigned char
      #define __sfr16 unsigned short
      #define __sfr32 unsigned long
      #define __data
      #define __idata
      #define __pdata
      #define __xdata
      #define __code
      #define __interrupt(vector)
      #define __using(bank)
      #define __naked
      #define __critical
      #define __reentrant
      #define __banked
      #define __nonbanked
